en:
  site_settings:
    course_progress_enabled: "Master switch: expose /course-progress.json and enable this plugin's Doc Categories features."
    course_progress_doc_navigation_enabled: "Show Previous/Next links at the end of the post stream on topics listed in a Docs Index Topic."
    course_progress_docs_sidebar_only_on_index_category: "Show the Doc Categories sidebar only in the category that has an Index Topic configured, not in its subcategories."
    course_progress_sidebar_markers_enabled: "Show read/total progress next to course categories in the sidebar, and a dot on lessons already read in the Docs sidebar."
    course_progress_non_course_topics: "Subtract this many topics from the sidebar read/total count, for indexes that list topics which are not lessons. Does not change /course-progress.json."
